name:  Mirror to Gitlab and Gitea
on:
  push:
    branches:  ['**']
  delete:

jobs:
  mirror:
    runs-on:  ubuntu-latest
    steps:
      -  name:  Mirror Clone Source
         run:  |
           git clone --mirror https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git source-mirror
           
      -  name:  Push To Gitlab
         run:  |
           cd source-mirror
           git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/personal-workspace9813530/digital-scholarship-mngmnt-system.git
           git push gitlab --prune --force 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

      -  name:  Push to Gitea
         run:  |
           cd source-mirror
           git remote add gitea https://pentao:${{ secrets.GITEA_TOKEN }}@gitea.dev-r.org/pentao/digital-scholarship-mngmnt-system.git
           git push gitea --prune --force 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
