@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <button
      type="button"
      (click)="close.emit()"
      aria-label="Close"
      class="fixed inset-0 cursor-default bg-ink-950/80"
    ></button>
    <div
      class="relative z-10 w-full max-w-sm rounded-xl border border-ink-800 bg-ink-900 p-6 shadow-lg"
    >
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Close"
        class="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-lg text-mist-400 hover:bg-ink-800 hover:text-mist-100"
      >
        <lucide-icon name="x" class="h-4 w-4"></lucide-icon>
      </button>
      <div class="flex flex-col items-center gap-3 text-center">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-full bg-gold-500/10 text-gold-500"
        >
          <lucide-icon name="lock" class="h-5 w-5"></lucide-icon>
        </div>
        <p class="text-sm font-semibold text-mist-100">Sign In Required</p>
        <p class="text-sm text-mist-400">{{ message() }}</p>
      </div>
      <button
        type="button"
        (click)="onLogin()"
        class="mt-5 w-full rounded-lg bg-gold-500 px-4 py-2.5 text-sm font-semibold text-ink-950 transition-colors hover:bg-gold-400"
      >
        Login
      </button>
    </div>
  </div>
}
