<header class="sticky top-0 z-40 border-b border-ink-800 bg-ink-950/95">
  <div class="mx-auto flex h-16 max-w-screen-2xl items-center justify-between gap-4 px-4 sm:px-6">
    <a routerLink="/scholarships" class="flex min-w-0 items-center gap-3">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-gold-500">
        <lucide-icon name="graduation-cap" class="h-5 w-5"></lucide-icon>
      </div>
      <div class="min-w-0">
        <p class="truncate font-display text-lg leading-tight text-mist-100">Digital Scholarship</p>
        <p class="hidden text-xs text-mist-400 sm:block">Management Portal</p>
      </div>
    </a>

    <div class="flex shrink-0 items-center gap-2">
      <button
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-mist-400 transition-colors hover:bg-ink-900 hover:text-mist-100"
      >
        <lucide-icon [name]="themeIcon()" class="h-4 w-4"></lucide-icon>
      </button>
      <a
        routerLink="/login"
        class="shrink-0 whitespace-nowrap rounded-lg bg-gold-500 px-4 py-2 text-sm font-semibold text-ink-950 transition-colors hover:bg-gold-400"
      >
        Sign In
      </a>
    </div>
  </div>
</header>
