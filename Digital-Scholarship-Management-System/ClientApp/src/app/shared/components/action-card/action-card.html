<a
  [routerLink]="route()"
  class="group flex h-full flex-col gap-3 rounded-xl border border-ink-800 bg-ink-950 p-4 transition-colors hover:border-gold-500/40 hover:bg-ink-900"
>
  <div class="flex items-start justify-between gap-2">
    <div class="flex h-9 w-9 items-center justify-center rounded-lg" [class]="iconToneClasses()">
      <lucide-icon [name]="icon()" class="h-5 w-5"></lucide-icon>
    </div>
    @if (count(); as pending) {
      <span
        class="flex h-5 min-w-5 items-center justify-center rounded-full bg-gold-500 px-1.5 text-xs font-semibold text-mist-100"
      >
        {{ pending }}
      </span>
    }
  </div>
  <div>
    <p class="text-sm font-semibold text-mist-100">{{ label() }}</p>
    <p class="mt-0.5 text-xs text-mist-400">{{ description() }}</p>
  </div>
</a>
