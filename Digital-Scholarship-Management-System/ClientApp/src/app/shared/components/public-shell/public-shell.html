<div class="flex min-h-screen flex-col">
  @if (profile(); as p) {
    <app-top-navbar [fullName]="p.fullName" [email]="p.email" (logout)="onLogout()" />
  } @else {
    <app-public-topbar />
  }
  <main class="mx-auto w-full max-w-screen-2xl flex-1 px-4 py-6 sm:px-6">
    <router-outlet></router-outlet>
  </main>
  <app-toast-container />
</div>
