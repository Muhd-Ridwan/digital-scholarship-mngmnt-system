<div class="flex h-full flex-col rounded-2xl border border-ink-800 bg-ink-900 p-5">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="flex h-7 w-7 items-center justify-center rounded-lg bg-gold-500/10 text-gold-500">
        <lucide-icon name="settings" class="h-4 w-4"></lucide-icon>
      </div>
      <h2 class="text-sm font-semibold text-mist-100">Management</h2>
    </div>
    @if (viewAllRoute()) {
      <a
        [routerLink]="viewAllRoute()"
        class="flex items-center gap-1 text-xs font-medium text-gold-500 hover:text-gold-500/80"
      >
        All tools
        <lucide-icon name="chevron-right" class="h-3.5 w-3.5"></lucide-icon>
      </a>
    }
  </div>

  <div class="mt-4 grid grid-cols-2 gap-3">
    @for (item of items(); track item.route) {
      <a
        [routerLink]="item.route"
        class="flex flex-col items-center gap-2 rounded-xl border border-ink-800 bg-ink-950 p-3 text-center transition-colors hover:border-gold-500/40 hover:bg-ink-900"
      >
        <div
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-gold-500/10 text-gold-500"
        >
          <lucide-icon [name]="item.icon" class="h-4 w-4"></lucide-icon>
        </div>
        <p class="text-xs font-medium text-mist-100">{{ item.label }}</p>
      </a>
    }
  </div>
</div>
