<div class="flex flex-col gap-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="font-display text-2xl text-mist-100">Reports &amp; analytics</h1>
      <p class="mt-1 text-sm text-mist-400">Application and award statistics, grouped by scholarship.</p>
    </div>
    <button
      type="button"
      (click)="exportReport()"
      class="flex items-center justify-center gap-2 self-start rounded-lg bg-gold-500 px-4 py-2.5 text-sm font-semibold text-mist-100 transition-colors hover:bg-gold-500/90 sm:self-auto"
    >
      <lucide-icon name="download" class="h-4 w-4"></lucide-icon>
      Export
    </button>
  </div>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-4">
    @for (stat of stats(); track stat.label) {
      <app-stat-card
        [label]="stat.label"
        [value]="stat.value"
        [icon]="stat.icon"
        [tone]="stat.tone"
        [description]="stat.description"
      />
    }
  </div>

  <div class="rounded-2xl border border-ink-800 bg-ink-900 p-5">
    <div class="flex items-center gap-2">
      <lucide-icon name="chart-column" class="h-4 w-4 text-gold-500"></lucide-icon>
      <h2 class="text-sm font-semibold text-mist-100">Applications by scholarship</h2>
    </div>
    <div class="mt-4 flex flex-col gap-3">
      @for (row of byScholarship(); track row.label) {
        <div class="flex items-center gap-3 text-sm">
          <span class="w-36 shrink-0 text-mist-100">{{ row.label }}</span>
          <div class="h-2.5 flex-1 overflow-hidden rounded-full bg-ink-800">
            <div class="h-full rounded-full bg-gold-500" [style.width.%]="row.percent"></div>
          </div>
          <span class="w-10 shrink-0 text-right text-mist-400">{{ row.count }}</span>
        </div>
      }
    </div>
  </div>
</div>
