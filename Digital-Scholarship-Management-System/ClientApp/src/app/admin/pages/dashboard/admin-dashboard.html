<div class="flex flex-col gap-6">
  <app-dashboard-header
    fullName="Muhammad Ridwan Bin Jesmarnel"
    subtitle="Here's an overview of scholarship management."
    primaryActionLabel="View All Applications"
    primaryActionIcon="calendar"
  />

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-4">
    <app-stat-card
      label="Scholarships Available"
      value="12"
      icon="graduation-cap"
      description="Open for application"
    />
    <app-stat-card
      label="Pending Review"
      value="24"
      icon="file-text"
      tone="warning"
      description="Awaiting decision"
    />
    <app-stat-card label="Active Users" value="85" icon="users" description="Across all roles" />
    <app-stat-card
      label="Total Awarded"
      value="132"
      icon="circle-check"
      tone="success"
      description="Scholarships granted"
    />
  </div>

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
    <div class="flex flex-col gap-3 lg:col-span-2">
      <div class="flex items-center gap-2">
        <lucide-icon name="zap" class="h-4 w-4 text-gold-500"></lucide-icon>
        <h2 class="text-sm font-semibold text-mist-100">My Actions</h2>
      </div>
      <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
        <app-action-card
          label="Review Applications"
          description="Approve or reject pending applications"
          icon="file-text"
          route="/admin/applications"
        />
        <app-action-card
          label="Manage Scholarships"
          description="Create and edit scholarship listings"
          icon="graduation-cap"
          route="/admin/scholarships"
        />
        <app-action-card
          label="Reports"
          description="View scholarship analytics"
          icon="chart-column"
          route="/admin/reports"
        />
        <app-action-card
          label="Audit Log"
          description="Review recent system activity"
          icon="history"
          route="/admin/audit-log"
          tone="warning"
        />
      </div>
    </div>

    <app-management-panel [items]="managementItems" viewAllRoute="/admin/tools" />
  </div>
</div>
