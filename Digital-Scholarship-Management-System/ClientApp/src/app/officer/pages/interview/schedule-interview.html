<div class="p-6 max-w-2xl mx-auto">

  <h2 class="text-2xl font-bold mb-6">
    Schedule Interview
  </h2>

  <form (ngSubmit)="submit()" class="space-y-5">

    <!-- Interview Date -->
    <div>
      <label class="block font-medium mb-2">
        Interview Date
      </label>

      <!-- <div class="relative">
        <lucide-icon
          [img]="AppIcons.Calendar"
          [size]="18"
          class="absolute right-3 top-1/2 -translate-y-1/2 ">
        </lucide-icon> -->

        <input
          type="date"
          [(ngModel)]="interviewDate"
          name="interviewDate"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2"
        />
      <!-- </div> -->
    </div>

    <!-- Interview Time -->
    <div>
      <label class="block font-medium mb-2">
        Interview Time
      </label>

      <!-- <div class="relative">
        <lucide-icon
          [img]="AppIcons.Clock"
          [size]="18"
          class="absolute right-3 top-1/2 -translate-y-1/2">
        </lucide-icon> -->

        <input
          type="time"
          [(ngModel)]="interviewTime"
          name="interviewTime"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2"
        />
      <!-- </div> -->
    </div>

    <!-- Interview Method -->
    <div>
      <label class="block font-medium mb-2">
        Interview Method
      </label>

      <select
        [(ngModel)]="interviewMethod"
        name="interviewMethod"
        class="w-full border border-gray-300 rounded-lg px-3 py-2"
      >
        <option value="Online">Online</option>
        <option value="In Person">In Person</option>
      </select>
    </div>

    <!-- Meeting Link -->
    <div *ngIf="interviewMethod === 'Online'">
      <label class="block font-medium mb-2">
        Meeting Link
      </label>

      <input
        type="url"
        [(ngModel)]="meetingLink"
        name="meetingLink"
        placeholder="https://teams.microsoft.com/..."
        class="w-full border border-gray-300 rounded-lg px-3 py-2"
      />
    </div>

    <!-- Location -->
    <div *ngIf="interviewMethod === 'In Person'">
      <label class="block font-medium mb-2">
        Location
      </label>

      <input
        type="text"
        [(ngModel)]="location"
        name="location"
        placeholder="Interview location"
        class="w-full border border-gray-300 rounded-lg px-3 py-2"
      />
    </div>

    <!-- Notes -->
    <div>
      <label class="block font-medium mb-2">
        Notes
      </label>

      <textarea
        [(ngModel)]="notes"
        name="notes"
        rows="4"
        placeholder="Additional interview instructions or notes..."
        class="w-full border border-gray-300 rounded-lg px-3 py-2"
      ></textarea>
    </div>

    <!-- Buttons -->
    <div class="flex gap-3 pt-4">

      <button
        type="button"
        routerLink="/officer/applications"
        class="px-4 py-2 border border-gray-300 rounded-lg"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg"
      >
        Schedule Interview
      </button>

    </div>

  </form>

</div>
