<div class="p-6">
  <h2 class="text-xl font-bold mb-4">Student Documents</h2>
  <table class="min-w-full border border-gray-300">
    <thead class="bg-black-100">
      <tr>
        <th class="px-4 py-2 border">Student</th>
        <th class="px-4 py-2 border">File Name</th>
        <th class="px-4 py-2 border">Type</th>
        <th class="px-4 py-2 border">Status</th>
        <th class="px-4 py-2 border">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let doc of documents()">
        <td class="px-4 py-2 border">{{ doc.studentName }}</td>
        <td class="px-4 py-2 border">{{ doc.fileName }}</td>
        <td class="px-4 py-2 border">{{ doc.documentType }}</td>
        <td class="px-4 py-2 border">{{ doc.status }}</td>
        <td class="px-4 py-2 border flex gap-2">
          <button (click)="downloadDocument(doc.id)" class="bg-blue-500 text-white px-2 py-1 rounded">View</button>
          <button (click)="reviewDocument(doc.id, 'Approved')" class="bg-green-500 text-white px-2 py-1 rounded">Approve</button>
          <button (click)="reviewDocument(doc.id, 'Rejected')" class="bg-red-500 text-white px-2 py-1 rounded">Reject</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
